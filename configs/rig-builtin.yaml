# Fallback rig — MacBook built-in camera + iPhone.
#
# Use this while the GO 3 is not in webcam mode. Everything in the pipeline is
# identical; only the device selectors change.
#
#   occnet preview -c configs/rig-builtin.yaml
#
# Note the geometry difference: the built-in camera is fixed in the lid, so the
# iPhone is the camera you actually move. That makes the iPhone the better
# reference only if it stays put — for a static rig, keep the built-in as
# reference and mount the iPhone rigidly beside it.
cameras:
  builtin: builtin
  iphone: iphone

reference: builtin

capture:
  width: 1280
  height: 720
  fps: 30.0
  backend: auto
  startup_timeout: 12.0

board:
  squares_x: 8
  squares_y: 11
  square_m: 0.030
  marker_m: 0.022
  dictionary: 5x5_250

mono:
  model: small
  device: auto
  input_height: 392
  fp16: true
  min_depth_m: 0.15
  max_depth_m: 12.0

stereo:
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  wls_filter: true
  min_depth_m: 0.15
  max_depth_m: 12.0

# A laptop-lid camera looks at a desk-sized volume; keep the grid tight so the
# voxel count stays small and the fusion stays real-time.
grid:
  voxel_size: 0.04
  bounds_min: [-1.5, -1.2, 0.0]
  bounds_max: [1.5, 1.2, 3.0]
  prob_hit: 0.85
  prob_miss: 0.35
  clamp_min: -2.5
  clamp_max: 3.5
  occupied_threshold: 0.65
  surface_margin_m: 0.05
  ray_step_ratio: 0.5
  carve_stride: 1        # carve free space with every Nth ray; raise to buy frame time
  max_ray_m: 6.0
  device: auto

calib_dir: data/calib-builtin
