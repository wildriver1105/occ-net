# Scan-everything rig — uses whatever cameras are plugged in at startup.
#
#   occnet watch -c configs/rig-all.yaml
#   occnet watch --all                     # same thing, without editing a config
#
# Why this is often the better default on macOS: AVFoundation reorders its
# device list at runtime. Connecting an iPhone as a Continuity Camera can move
# the built-in camera from index 0 to index 1, so any index written into a
# config goes stale. Scanning at startup sidesteps that entirely.
#
# Cameras are keyed by their detected role (insta360 / iphone / builtin), with a
# numeric suffix if several share a role. `reference` is used when it happens to
# be present; otherwise the first camera found becomes the rig frame.
cameras: all

reference: insta360

capture:
  width: 1280
  height: 720
  fps: 30.0
  # `ffmpeg` addresses devices by name rather than index, so it is immune to
  # AVFoundation reordering. `auto` tries OpenCV first for lower latency.
  backend: auto
  startup_timeout: 12.0

board:
  squares_x: 8
  squares_y: 11
  square_m: 0.030
  marker_m: 0.022
  dictionary: 5x5_250

mono:
  model: small
  device: auto
  input_height: 392
  fp16: true
  min_depth_m: 0.15
  max_depth_m: 12.0

stereo:
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  wls_filter: true
  min_depth_m: 0.15
  max_depth_m: 12.0

grid:
  voxel_size: 0.05
  bounds_min: [-2.0, -1.5, 0.0]
  bounds_max: [2.0, 1.5, 4.0]
  prob_hit: 0.85
  prob_miss: 0.35
  clamp_min: -2.5
  clamp_max: 3.5
  occupied_threshold: 0.65
  surface_margin_m: 0.06
  ray_step_ratio: 0.5
  carve_stride: 4
  max_ray_m: 8.0
  device: auto

calib_dir: data/calib-all
