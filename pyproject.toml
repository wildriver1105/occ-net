[project]
name = "occnet"
version = "0.1.0"
description = "Dual-camera occupancy network experiment rig (Insta360 GO 3 + iPhone Continuity Camera)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "timm>=1.0",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "trimesh>=4.4",
    "rerun-sdk>=0.18",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "pillow>=10.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
o3d = ["open3d>=0.18"]

[project.scripts]
occnet = "occnet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occnet"]

[tool.uv]
package = true
